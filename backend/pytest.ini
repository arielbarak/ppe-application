[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
pythonpath = .
addopts = -ra --strict-markers --strict-config
markers =
    integration: end-to-end API tests using TestClient
    websocket: WebSocket-specific tests
    slow: tests >1s (param sweeps)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:cryptography.*
    ignore::DeprecationWarning
