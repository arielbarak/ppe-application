[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
pythonpath = .
addopts = -ra --strict-markers --strict-config
markers =
    integration: end-to-end API tests using TestClient
    websocket: WebSocket-specific tests
    scale: large-N protocol runs (e.g. the 50-user end-to-end test)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:cryptography.*
    ignore::DeprecationWarning
